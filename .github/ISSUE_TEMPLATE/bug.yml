# GENERATED by `abcli feedback templates --sync` from the report contract
# (agents/feedback/report.py). Do not edit by hand — `--check` will fail, and the CLI door and
# this one would drift. Change REQUIRED/PROMPTS and re-sync.
name: "Bug report"
description: "Something behaves differently from what it promises"
labels: ["type:bug", "from:dev", "area:triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Paste the evidence, don't classify it.** A file path, a stack trace, or the command that failed. You do not need to know which library this belongs to — that is derived from what you paste. Without it, this issue can only be routed by guesswork.
  - type: textarea
    id: expected
    attributes:
      label: "Expected"
      description: "what you expected to happen"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual"
      description: "what actually happened"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "a file path, a traceback, or a failing command — the thing that proves it, and the thing the engine routes on"
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      description: "the steps to reproduce it"
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "the version you are running (`abconvoy --version`, or the package version)"
